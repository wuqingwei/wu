name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  check_version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/wu/Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crates/wu/Cargo.toml version ${version}"
            exit 1
          fi
      - name: Check that the changelog has entries for this version
        run: script/changelog-section "${GITHUB_REF_NAME#v}" >/dev/null

  bundle_mac:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    # Intel builds are cross-compiled on the Apple Silicon runner.
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        run: brew install lld
      - name: Use the stable release channel
        run: echo stable > crates/wu/RELEASE_CHANNEL
      # With MACOS_CERTIFICATE alone the bundle is signed but not notarized.
      # Without it the bundle is ad-hoc signed.
      - name: Prepare provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            profile_path="$RUNNER_TEMP/embedded.provisionprofile"
            echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
            echo "MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
          fi
      - name: Bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: script/bundle-mac ${{ matrix.arch }}-apple-darwin
      - name: Check that every string and command has its Chinese text
        if: matrix.arch == 'aarch64'
        run: script/check-translations --binary target/aarch64-apple-darwin/release/wu
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.arch }}-apple-darwin/release/Wu-${{ matrix.arch }}.dmg
            target/wu-remote-server-macos-${{ matrix.arch }}.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dsym
          path: target/${{ matrix.arch }}-apple-darwin/release/Wu.dSYM.zip
          if-no-files-found: error

  bundle_linux:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: echo stable > crates/wu/RELEASE_CHANNEL
      - name: Bundle
        run: ./script/bundle-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/wu-linux-${{ matrix.arch }}.tar.gz
            target/wu-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error

  bundle_linux_2004:
    # Ubuntu 20.04 build for wuqingwei/wu fork.
    # GitHub hosted ubuntu-20.04 runners were removed on 2025-04-15,
    # so this builds inside an ubuntu:20.04 container on ubuntu-24.04.
    # The resulting binary links against glibc 2.31 and runs on Ubuntu 20.04.
    # script/linux already handles Ubuntu 20.04 (clang-18 + libstdc++-11-dev
    # from the ubuntu-toolchain-r PPA), but bundle-linux defaults to `clang`,
    # which is clang-10 on 20.04 and cannot build webrtc-sys (needs C++20),
    # so CC/CXX must be pinned to clang-18 here.
    needs: check_version
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build in Ubuntu 20.04 container
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ubuntu:20.04 bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y curl git ca-certificates lsb-release gnupg
              # Checkout is owned by the runner user, not by container root.
              git config --global --add safe.directory /work
              ./script/linux
              # script/linux installs Ubuntu 20.04's system CMake 3.16.3,
              # but wasmtime-c-api-impl's build script uses file(CONFIGURE),
              # which needs CMake >= 3.19. Upgrade with the repo's own
              # script/install-cmake (KitWare apt repo) before building.
              ./script/install-cmake 3.30.4
              # yeslogic-fontconfig-sys probes fontconfig via pkg-config,
              # which failed in run 41794979956 even though libfontconfig1-dev
              # was installed in this same container. Pin the multiarch .pc
              # directory explicitly and fail fast if it is still unresolvable,
              # instead of failing 12 minutes into the cargo build.
              export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
              pkg-config --modversion fontconfig
              export PATH="$HOME/.cargo/bin:$PATH"
              export CC=clang-18 CXX=clang++-18
              if command -v llvm-objcopy-18 >/dev/null 2>&1; then
                ln -sf "$(command -v llvm-objcopy-18)" /usr/local/bin/llvm-objcopy
              fi
              echo stable > crates/wu/RELEASE_CHANNEL
              ./script/bundle-linux
              # bundle-linux always produces wu-linux-x86_64.tar.gz,
              # the same name as the ubuntu-22.04 build, so rename it
              # to avoid overwriting that asset when artifacts are merged.
              mv target/release/wu-linux-x86_64.tar.gz \
                 target/release/wu-linux-x86_64-ubuntu2004.tar.gz
              mv target/wu-remote-server-linux-x86_64.gz \
                 target/wu-remote-server-linux-x86_64-ubuntu2004.gz
            '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-ubuntu2004
          path: |
            target/release/wu-linux-x86_64-ubuntu2004.tar.gz
            target/wu-remote-server-linux-x86_64-ubuntu2004.gz
          if-no-files-found: error

  bundle_windows:
    needs: check_version
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: Set-Content -Path crates/wu/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Bundle
        run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            target/Wu-x86_64.exe
            target/wu-remote-server-windows-x86_64.gz
          if-no-files-found: error

  release:
    needs: [bundle_mac, bundle_linux, bundle_windows, bundle_linux_2004]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tags for the changelog link
        run: git fetch --quiet --tags --force --depth=1 origin
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Keep debug symbols out of the release assets
        run: find artifacts -name '*.dSYM.zip' -delete
      - name: Write the release body
        run: |
          {
            cat .github/release/body.md
            echo
            echo "## What's new"
            echo
            script/changelog-section "${GITHUB_REF_NAME#v}"
            previous=$(git tag --sort=-v:refname | grep -A1 -x "${GITHUB_REF_NAME}" | tail -n +2)
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-body.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: artifacts/**
