name: build-ubuntu2004
# Manual-only Ubuntu 20.04 build for the wuqingwei/wu fork.
# Unlike release.yml, this does not need a version tag: the fork already
# carries upstream tag v1.1.16 pointing at the pre-workflow commit, so a
# tag-triggered release cannot run the new 20.04 job without moving that tag.
# Trigger from the Actions tab (or `gh workflow run build-ubuntu2004.yml`),
# then download the artifact from the run.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  build_linux_2004:
    # GitHub hosted ubuntu-20.04 runners were removed on 2025-04-15,
    # so this builds inside an ubuntu:20.04 container on ubuntu-24.04.
    # The resulting binary links against glibc 2.31 and runs on Ubuntu 20.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build in Ubuntu 20.04 container
        run: |
          # The build script lives in .github/workflows/build-2004-inner.sh
          # and runs inside the container; see the header comment there for
          # why it must not be inlined as `bash -euxc '...'` (an apostrophe
          # anywhere inside would close the quote early and run the rest of
          # the build on the host instead -- that silently broke runs 3-15).
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ubuntu:20.04 bash -eux /work/.github/workflows/build-2004-inner.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-ubuntu2004
          path: |
            target/release/wu-linux-x86_64-ubuntu2004.tar.gz
            target/wu-remote-server-linux-x86_64-ubuntu2004.gz
          if-no-files-found: error
